services:
  shitpost-worker:
    build:
      context: ./shitpost_worker
    container_name: shitpost-worker
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SHITPOST_REGISTRY_PATH=${SHITPOST_REGISTRY_PATH}
      - SHITPOST_SHARED_MEDIA_DIR=${SHITPOST_SHARED_MEDIA_DIR}
      - SHITPOST_DOWNLOAD_TIMEOUT_SECONDS=${SHITPOST_DOWNLOAD_TIMEOUT_SECONDS}
      - SHITPOST_MAX_MEDIA_BYTES=${SHITPOST_MAX_MEDIA_BYTES}
      - SHITPOST_RSS_USER_AGENT=${SHITPOST_RSS_USER_AGENT}
    volumes:
      - ./shared_media:/home/node/.n8n-files/shitpost_media
      - ./shitpost_data:/data

  shitpost-scheduler:
    build:
      context: ./shitpost_scheduler
    container_name: shitpost-scheduler
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SHITPOST_SERVICE_URL=${SHITPOST_SERVICE_URL}
      - SHITPOST_DISCORD_WEBHOOK_URL=${SHITPOST_DISCORD_WEBHOOK_URL}
      - SHITPOST_INTERVAL_HOURS=${SHITPOST_INTERVAL_HOURS:-4}
      - SHITPOST_MEDIA_DIR=/media
      - SHITPOST_DATA_DIR=/data
    volumes:
      - ./shared_media:/media:ro
      - ./shitpost_data:/data
    depends_on:
      - shitpost-worker

  shitbot-manager:
    build:
      context: ./shitbot_manager
    container_name: shitbot-manager
    restart: unless-stopped
    ports:
      - "${SHITBOT_MANAGER_PORT:-8080}:8080"
    environment:
      - TZ=${TZ}
      - SHITPOST_SERVICE_URL=${SHITPOST_SERVICE_URL}
      - SHITPOST_REGISTRY_PATH=${SHITPOST_REGISTRY_PATH}
      - SHITPOST_SCHEDULER_URL=${SHITPOST_SCHEDULER_URL:-http://shitpost-scheduler:8001}
    volumes:
      - ./shitpost_data:/data
      - ./shared_media:/media:ro
    depends_on:
      - shitpost-worker
      - shitpost-scheduler
